<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1080" viewBox="0 0 600 1080"><!-- Original Russian instructional diagram, mobile composition. --><rect width="600" height="1080" rx="22" fill="#edf6fb"/><text x="35" y="55" font-family="Arial,sans-serif" font-size="30" fill="#092d40">Из чего собрать заголовок</text><text x="35" y="94" font-family="Arial,sans-serif" font-size="30" fill="#092d40">страницы</text><text x="35" y="142" font-family="Arial,sans-serif" font-size="21" fill="#516c7c">Учебный пример для услуги: ничего лишнего,</text><text x="35" y="170" font-family="Arial,sans-serif" font-size="21" fill="#516c7c">только факты.</text><rect x="35" y="205" width="530" height="180" rx="18" fill="#d4eff8"/><text x="60" y="243" font-family="Arial,sans-serif" font-size="26" fill="#092d40">1. Предмет</text><text x="60" y="278" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Установка</text><text x="60" y="313" font-family="Arial,sans-serif" font-size="24" fill="#092d40">кондиционеров</text><path d="M300 390v17m-7-7 7 7 7-7" fill="none" stroke="#006d98" stroke-width="3"/><rect x="35" y="415" width="530" height="180" rx="18" fill="#fff0cf"/><text x="60" y="453" font-family="Arial,sans-serif" font-size="26" fill="#092d40">2. Уточнение</text><text x="60" y="488" font-family="Arial,sans-serif" font-size="24" fill="#092d40">В Москве</text><text x="60" y="523" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Монтаж</text><text x="60" y="558" font-family="Arial,sans-serif" font-size="24" fill="#092d40">и подключение</text><path d="M300 600v17m-7-7 7 7 7-7" fill="none" stroke="#006d98" stroke-width="3"/><rect x="35" y="625" width="530" height="180" rx="18" fill="#d8eee5"/><text x="60" y="663" font-family="Arial,sans-serif" font-size="26" fill="#092d40">3. Проверка</text><text x="60" y="698" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Это есть на странице?</text><text x="60" y="733" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Это соответствует</text><text x="60" y="768" font-family="Arial,sans-serif" font-size="24" fill="#092d40">вашей услуге?</text><text x="35" y="875" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Установка кондиционеров в Москве —</text><text x="35" y="906" font-family="Arial,sans-serif" font-size="23" fill="#092d40">монтаж и подключение</text><text x="35" y="949" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Текст ниже описывает услугу подробнее.</text><text x="35" y="980" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Заголовок на странице — H1.</text></svg>
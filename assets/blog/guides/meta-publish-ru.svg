<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600"><!-- Original Russian instructional diagram; not a screenshot or client evidence. --><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#006d98"/></marker></defs><rect width="1080" height="600" rx="24" fill="#edf6fb"/><text x="44" y="65" fill="#092d40" font-family="Arial,sans-serif" font-size="34">Как проверить метатеги после изменения</text><text x="44" y="108" fill="#516c7c" font-family="Arial,sans-serif" font-size="21">Редактирование в браузере не сохраняет изменения на сайте.</text><rect x="44" y="152" width="310" height="264" rx="18" fill="#d4eff8"/><text x="68" y="198" fill="#092d40" font-family="Arial,sans-serif" font-size="24">1. В редакторе</text><text x="68" y="252" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Откройте настройки</text><text x="68" y="286" fill="#092d40" font-family="Arial,sans-serif" font-size="22">страницы. Заполните</text><text x="68" y="320" fill="#092d40" font-family="Arial,sans-serif" font-size="22">заголовок и описание.</text><path d="M358 280h22" stroke="#006d98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="384" y="152" width="310" height="264" rx="18" fill="#fff0cf"/><text x="408" y="198" fill="#092d40" font-family="Arial,sans-serif" font-size="24">2. На сайте</text><text x="408" y="252" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Сохраните изменения.</text><text x="408" y="286" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Опубликуйте страницу.</text><text x="408" y="320" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Откройте её адрес.</text><path d="M698 280h22" stroke="#006d98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="724" y="152" width="310" height="264" rx="18" fill="#d8eee5"/><text x="748" y="198" fill="#092d40" font-family="Arial,sans-serif" font-size="24">3. В исходном коде</text><text x="748" y="252" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Найдите title</text><text x="748" y="286" fill="#092d40" font-family="Arial,sans-serif" font-size="22">и description.</text><text x="748" y="320" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Сравните с таблицей.</text><path d="M44 452h992" stroke="#cfdee6"/><text x="44" y="496" fill="#092d40" font-family="Arial,sans-serif" font-size="23">Совпадает код → изменение опубликовано.</text><text x="44" y="531" fill="#092d40" font-family="Arial,sans-serif" font-size="23">Вид результата в поиске проверяется отдельно, после обхода страницы.</text></svg>
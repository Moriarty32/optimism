<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1080" viewBox="0 0 600 1080"><!-- Original Russian instructional diagram, mobile composition. --><rect width="600" height="1080" rx="22" fill="#edf6fb"/><text x="35" y="55" font-family="Arial,sans-serif" font-size="30" fill="#092d40">Как проверить путь заявки</text><text x="35" y="142" font-family="Arial,sans-serif" font-size="21" fill="#516c7c">Проверяйте три результата по отдельности.</text><rect x="35" y="205" width="530" height="180" rx="18" fill="#d4eff8"/><text x="60" y="243" font-family="Arial,sans-serif" font-size="26" fill="#092d40">1. На сайте</text><text x="60" y="278" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Заполните форму.</text><text x="60" y="313" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Запишите время</text><text x="60" y="348" font-family="Arial,sans-serif" font-size="24" fill="#092d40">и подтверждение.</text><path d="M300 390v17m-7-7 7 7 7-7" fill="none" stroke="#006d98" stroke-width="3"/><rect x="35" y="415" width="530" height="180" rx="18" fill="#fff0cf"/><text x="60" y="453" font-family="Arial,sans-serif" font-size="26" fill="#092d40">2. В аналитике</text><text x="60" y="488" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Найдите событие.</text><text x="60" y="523" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Проверьте, какое</text><text x="60" y="558" font-family="Arial,sans-serif" font-size="24" fill="#092d40">действие считается.</text><path d="M300 600v17m-7-7 7 7 7-7" fill="none" stroke="#006d98" stroke-width="3"/><rect x="35" y="625" width="530" height="180" rx="18" fill="#d8eee5"/><text x="60" y="663" font-family="Arial,sans-serif" font-size="26" fill="#092d40">3. У получателя</text><text x="60" y="698" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Найдите обращение</text><text x="60" y="733" font-family="Arial,sans-serif" font-size="24" fill="#092d40">в почте или системе</text><text x="60" y="768" font-family="Arial,sans-serif" font-size="24" fill="#092d40">учёта заявок.</text><text x="35" y="875" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Событие в аналитике не подтверждает</text><text x="35" y="906" font-family="Arial,sans-serif" font-size="23" fill="#092d40">доставку контакта.</text><text x="35" y="949" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Проверку завершает найденное обращение у</text><text x="35" y="980" font-family="Arial,sans-serif" font-size="23" fill="#092d40">менеджера.</text></svg>
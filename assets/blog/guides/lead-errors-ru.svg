<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600"><!-- Original Russian instructional diagram; not a screenshot or client evidence. --><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#006d98"/></marker></defs><rect width="1080" height="600" rx="24" fill="#edf6fb"/><text x="44" y="65" fill="#092d40" font-family="Arial,sans-serif" font-size="34">Что исправлять по результату проверки</text><text x="44" y="108" fill="#516c7c" font-family="Arial,sans-serif" font-size="21">Сначала найдите конкретный сбой, затем назначьте действие.</text><rect x="44" y="152" width="310" height="264" rx="18" fill="#d4eff8"/><text x="68" y="198" fill="#092d40" font-family="Arial,sans-serif" font-size="24">1. Контакта нет</text><text x="68" y="252" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Есть подтверждение</text><text x="68" y="286" fill="#092d40" font-family="Arial,sans-serif" font-size="22">на сайте, но письма</text><text x="68" y="320" fill="#092d40" font-family="Arial,sans-serif" font-size="22">или заявки нет.</text><path d="M358 280h22" stroke="#006d98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="384" y="152" width="310" height="264" rx="18" fill="#fff0cf"/><text x="408" y="198" fill="#092d40" font-family="Arial,sans-serif" font-size="24">2. Цели нет</text><text x="408" y="252" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Обращение дошло,</text><text x="408" y="286" fill="#092d40" font-family="Arial,sans-serif" font-size="22">но аналитика</text><text x="408" y="320" fill="#092d40" font-family="Arial,sans-serif" font-size="22">его не видит.</text><path d="M698 280h22" stroke="#006d98" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="724" y="152" width="310" height="264" rx="18" fill="#d8eee5"/><text x="748" y="198" fill="#092d40" font-family="Arial,sans-serif" font-size="24">3. Цель после ошибки</text><text x="748" y="252" fill="#092d40" font-family="Arial,sans-serif" font-size="22">Форма не отправлена,</text><text x="748" y="286" fill="#092d40" font-family="Arial,sans-serif" font-size="22">но цель уже</text><text x="748" y="320" fill="#092d40" font-family="Arial,sans-serif" font-size="22">считается.</text><path d="M44 452h992" stroke="#cfdee6"/><text x="44" y="496" fill="#092d40" font-family="Arial,sans-serif" font-size="23">Контакта нет → проверить доставку. Цели нет → проверить счётчик.</text><text x="44" y="531" fill="#092d40" font-family="Arial,sans-serif" font-size="23">Цель после ошибки → уточнить условие её достижения.</text></svg>
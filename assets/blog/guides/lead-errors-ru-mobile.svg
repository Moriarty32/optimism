<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1080" viewBox="0 0 600 1080"><!-- Original Russian instructional diagram, mobile composition. --><rect width="600" height="1080" rx="22" fill="#edf6fb"/><text x="35" y="55" font-family="Arial,sans-serif" font-size="30" fill="#092d40">Что исправлять по результату</text><text x="35" y="94" font-family="Arial,sans-serif" font-size="30" fill="#092d40">проверки</text><text x="35" y="142" font-family="Arial,sans-serif" font-size="21" fill="#516c7c">Сначала найдите конкретный сбой, затем</text><text x="35" y="170" font-family="Arial,sans-serif" font-size="21" fill="#516c7c">назначьте действие.</text><rect x="35" y="205" width="530" height="180" rx="18" fill="#d4eff8"/><text x="60" y="243" font-family="Arial,sans-serif" font-size="26" fill="#092d40">1. Контакта нет</text><text x="60" y="278" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Есть подтверждение</text><text x="60" y="313" font-family="Arial,sans-serif" font-size="24" fill="#092d40">на сайте, но письма</text><text x="60" y="348" font-family="Arial,sans-serif" font-size="24" fill="#092d40">или заявки нет.</text><path d="M300 390v17m-7-7 7 7 7-7" fill="none" stroke="#006d98" stroke-width="3"/><rect x="35" y="415" width="530" height="180" rx="18" fill="#fff0cf"/><text x="60" y="453" font-family="Arial,sans-serif" font-size="26" fill="#092d40">2. Цели нет</text><text x="60" y="488" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Обращение дошло,</text><text x="60" y="523" font-family="Arial,sans-serif" font-size="24" fill="#092d40">но аналитика</text><text x="60" y="558" font-family="Arial,sans-serif" font-size="24" fill="#092d40">его не видит.</text><path d="M300 600v17m-7-7 7 7 7-7" fill="none" stroke="#006d98" stroke-width="3"/><rect x="35" y="625" width="530" height="180" rx="18" fill="#d8eee5"/><text x="60" y="663" font-family="Arial,sans-serif" font-size="26" fill="#092d40">3. Цель после ошибки</text><text x="60" y="698" font-family="Arial,sans-serif" font-size="24" fill="#092d40">Форма не отправлена,</text><text x="60" y="733" font-family="Arial,sans-serif" font-size="24" fill="#092d40">но цель уже</text><text x="60" y="768" font-family="Arial,sans-serif" font-size="24" fill="#092d40">считается.</text><text x="35" y="875" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Контакта нет → проверить доставку. Цели</text><text x="35" y="906" font-family="Arial,sans-serif" font-size="23" fill="#092d40">нет → проверить счётчик.</text><text x="35" y="949" font-family="Arial,sans-serif" font-size="23" fill="#092d40">Цель после ошибки → уточнить условие её</text><text x="35" y="980" font-family="Arial,sans-serif" font-size="23" fill="#092d40">достижения.</text></svg>